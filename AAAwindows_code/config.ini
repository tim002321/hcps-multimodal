[bluetooth]
# 心电设备广播名称，多个用英文逗号分隔
# 与原 config_collect.ini 中的 bluetooth_nameX 对应
device_names=E1220511000413,E1220511000444,E1220511000167,E1220511000415,E1220511000406,E1220511000200,E1230404000001,E1220511000239,E1220511000212,E1220511000427,E1220511000378,E1220511000196,E1220511000400,E1220511000434

# 扫描时长（秒）
scan_timeout=10

# 连续扫描多少次都找不到，才在界面上显示"未找到/无法连接"（之前一直显示"扫描中 第 k/N 次"）
scan_attempts=10

# 连接后是否打印服务/特征表（排查 handle 对应关系时设为 true）
debug=false

[bracelet]
# 绿光手环设备广播名称，多个用英文逗号分隔
# 留空表示不启用手环接收（只跑心电）
bracelet_names=MPPB20000008

# 手环扫描时长（秒）
scan_timeout=10

# 手环：连续扫描多少次都找不到才显示"未找到"
scan_attempts=10

# 手环通知特征 UUID（留空则自动发现：常见透传 UUID → 任意 notify/indicate 特征）
notify_uuid=

# 启动延迟（秒）：避免与心电模块同时扫描相互干扰
start_delay=3

# 断开后重连间隔（秒）
reconnect_interval=5

# 未扫描到手环设备时的重扫间隔（秒）
rescan_interval=10

[storage]
# 数据库批量提交：距上次提交超过 commit_interval 秒、或累计 commit_rows 行时提交一次
# （避免每条记录一次 fsync 阻塞写库线程；WAL 下同时使用 synchronous=NORMAL）
commit_interval=0.5
commit_rows=500

# 写库线程主动提交间隔（秒）：即使数据量很小，也保证事务及时落盘
flush_interval=0.5

[output]
# 输出 JSONL 文件路径，留空或 none 表示不写文件
# （控制台只打印「连接成功」与「设备掉线」两类日志，不再打印采集数据）
out_file=ecg_data.jsonl

[server]
# 总线上传地址（预留）：实时数据与四个模型的结果都发到这个地址。
# 登录界面里填的 IP 会覆盖这里的值并写回本文件。
host=127.0.0.1
port=9000

[devices]
# 预留设备的开关与接入方式（true 才真正启动；未接入时界面显示「预留」）
# 表面肌电：LSL 流名，与主工程 data_emg.py 用的是同一路
emg_enabled=false
emg_stream=BLE_ExG5_TimeSeries
# 眼动仪：UDP 端口（SmartEye 协议，与主工程 data_udp.py 一致）
eye_enabled=false
eye_udp_port=8003

[ui]
# 界面字号倍率：1.0 = 原始设计值。
# 高 DPI 屏（如 2560×1600 / 系统 150%）由 Qt 自动缩放，这里不用动；
# 觉得字还是小就往上调，1.15 / 1.3 比较常用，最大 3.0。
# 命令行 --ui-scale 和环境变量 HCP_UI_SCALE 的优先级更高。
scale=1.0

[vision]
# 摄像头实时打哈欠检测（疲劳监测）。默认开启：进入摄像头页时勾选框已勾上，
# 点「开始采集」后自动加载模型（首次 2~5 秒）。不想用就取消勾选，或把这里改 false。
# 模型文件用 tools/vision/fetch_models.py 下载到 models/。
enabled=true

# 推理间隔（秒）：0.15 ≈ 6~7fps。哈欠持续 2~5 秒，不需要逐帧跑。
interval=0.15

# 张嘴概率阈值 0~1。
#   【重要】0.5 只是中性初值，上游模型作者在车载数据集上用的是 0.2。
#   本机场景（距离/光照/镜头）不同，阈值必须用
#   tools/vision/calibrate_threshold.py 在本地素材上标定后再改这里。
threshold=0.5

# 连续张嘴超过多少秒才算一次哈欠（防说话/张嘴呼吸误报）
yawn_min_sec=1.5

# 一次哈欠后的冷却时间（秒），避免把一次哈欠拆成多次
cooldown_sec=5.0

# 概率瞬时跌落的容忍窗口（秒）。
#   判定要求「连续张嘴 1.5 秒」，如果某帧概率掉到阈值以下就立刻清零重算，
#   7fps 下几乎不可能凑满 —— 这是之前「识别不灵敏」的主因。
#   0.3 秒（约 2 帧）足以吸收模型抖动和瞬时遮挡，又挡得住 0.5 秒级的说话张嘴。
#   设在 0.5 以上会让说话/打哈欠分不开，不建议。
dip_grace=0.3

# 人脸检测后端：
#   auto  = 有 torch 就用 GPU，没有再退到 onnxruntime
#   torch = 只用 ultralytics + torch
#   onnx  = 只用 onnxruntime（纯 CPU，需要 models/yolov8n-face.onnx）
backend=auto

# 人脸检测置信度阈值
face_conf=0.35

