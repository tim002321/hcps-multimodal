[bluetooth]
# 心电设备广播名称，多个用英文逗号分隔
# 与原 config_collect.ini 中的 bluetooth_nameX 对应
device_names=E1220511000413,E1220511000444,E1220511000167,E1220511000415,E1220511000406,E1220511000200,E1230404000001,E1220511000239,E1220511000212,E1220511000427,E1220511000378,E1220511000196,E1220511000400,E1220511000434

# 扫描时长（秒）
scan_timeout=10

# 连续扫描多少次都找不到，才在界面上显示"未找到/无法连接"（之前一直显示"扫描中 第 k/N 次"）
scan_attempts=10

# 连接后是否打印服务/特征表（排查 handle 对应关系时设为 true）
debug=false

[bracelet]
# 绿光手环设备广播名称，多个用英文逗号分隔
# 留空表示不启用手环接收（只跑心电）
bracelet_names=MPPB20000008

# 手环扫描时长（秒）
scan_timeout=10

# 手环：连续扫描多少次都找不到才显示"未找到"
scan_attempts=10

# 手环通知特征 UUID（留空则自动发现：常见透传 UUID → 任意 notify/indicate 特征）
notify_uuid=

# 启动延迟（秒）：避免与心电模块同时扫描相互干扰
start_delay=3

# 断开后重连间隔（秒）
reconnect_interval=5

# 未扫描到手环设备时的重扫间隔（秒）
rescan_interval=10

[storage]
# 数据库批量提交：距上次提交超过 commit_interval 秒、或累计 commit_rows 行时提交一次
# （避免每条记录一次 fsync 阻塞写库线程；WAL 下同时使用 synchronous=NORMAL）
commit_interval=0.5
commit_rows=500

# 写库线程主动提交间隔（秒）：即使数据量很小，也保证事务及时落盘
flush_interval=0.5

[output]
# 输出 JSONL 文件路径，留空或 none 表示不写文件
# （控制台只打印「连接成功」与「设备掉线」两类日志，不再打印采集数据）
out_file=ecg_data.jsonl

[server]
# 总线上传地址（预留）：实时数据与四个模型的结果都发到这个地址。
# 登录界面里填的 IP 会覆盖这里的值并写回本文件。
host=127.0.0.1
port=9000

[devices]
# 预留设备的开关与接入方式（true 才真正启动；未接入时界面显示「预留」）
# 表面肌电：LSL 流名，与主工程 data_emg.py 用的是同一路
emg_enabled=false
emg_stream=BLE_ExG5_TimeSeries
# 眼动仪：UDP 端口（SmartEye 协议，与主工程 data_udp.py 一致）
eye_enabled=false
eye_udp_port=8003

[ui]
# 界面字号倍率：1.0 = 原始设计值。
# 高 DPI 屏（如 2560×1600 / 系统 150%）由 Qt 自动缩放，这里不用动；
# 觉得字还是小就往上调，1.15 / 1.3 比较常用，最大 3.0。
# 命令行 --ui-scale 和环境变量 HCP_UI_SCALE 的优先级更高。
scale=1.25

[camera]
# USB 摄像头采集参数。现场用 15fps：哈欠检测本身只有 6~7Hz，用不到 30fps，
# 而帧是逐张 JPEG 落盘的，帧率直接决定占用空间（30→15fps 体积约减半）。
# 想要更流畅的回放可以临时改回 30，代价是图片和录像都大一倍。
# 从 2026-11 起帧和录像都存到会话目录下的 camera_<时间戳>\ 文件夹，库里只有索引。
index=0
width=640
height=480
fps=15
quality=80

# 图片与录像存哪里、存不存。
# 从 2026-11 起，帧不再以 BLOB 塞进会话库，而是落到会话目录下：
#     data\<组别>\<姓名_时间>\camera_<时间戳>\frames\000001.jpg …
#     data\<组别>\<姓名_时间>\camera_<时间戳>\video_<时间戳>.mp4
# 库里只留索引（时间、帧号、相对路径），一场 100 分钟的会话索引不到 1 MB。
# 两个都 false 就只写索引、不落任何图（等于空录，一般不用）。
save_frames=true
save_video=true

[vision]
# 摄像头实时打哈欠检测（疲劳监测）。默认开启：进入摄像头页时勾选框已勾上，
# 点「开始采集」后自动加载模型（首次 2~5 秒）。不想用就取消勾选，或把这里改 false。
# 模型文件用 tools/vision/fetch_models.py 下载到 models/。
enabled=true

# 推理间隔（秒）：0.15 ≈ 6~7fps。哈欠持续 2~5 秒，不需要逐帧跑。
interval=0.15

# 张嘴概率阈值 0~1。
#   【重要】0.5 只是中性初值，上游模型作者在车载数据集上用的是 0.2。
#   本机场景（距离/光照/镜头）不同，阈值必须用
#   tools/vision/calibrate_threshold.py 在本地素材上标定后再改这里。
#
#   2026-11-18 用当场素材标定：一段 69 秒的实测（嘴部小块裁剪已核对正确、
#   峰值那一帧肉眼可见大张嘴）——
#       阈值 0.50：≥阈值只占 6.5%，最长连续 1.00 秒 → 不到 1.5 秒，判不出哈欠
#       阈值 0.30：≥阈值占 11.4%，最长连续 2.67 秒 → 正常判出
#   模型对这个人/这个机位整体偏保守（中位 0.03、峰值 0.80），所以取 0.30。
#   如果现场发现说话也被算成哈欠，往上调到 0.35；如果还是漏，往下到 0.25。
threshold=0.30

# 连续张嘴超过多少秒才算一次哈欠（防说话/张嘴呼吸误报）
yawn_min_sec=1.5

# 一次哈欠后的冷却时间（秒），避免把一次哈欠拆成多次
cooldown_sec=5.0

# 概率瞬时跌落的容忍窗口（秒）。
#   判定要求「连续张嘴 1.5 秒」，如果某帧概率掉到阈值以下就立刻清零重算，
#   7fps 下几乎不可能凑满 —— 这是之前「识别不灵敏」的主因。
#   0.3 秒（约 2 帧）足以吸收模型抖动和瞬时遮挡，又挡得住 0.5 秒级的说话张嘴。
#   设在 0.5 以上会让说话/打哈欠分不开，不建议。
dip_grace=0.3

# 只识别画面中间那一个人（0~0.5）。
#   现场经常有多人：同事在旁边、有人从镜头后走过。原来取"面积最大的一张脸"，
#   离镜头更近的旁观者会顶掉被试，哈欠就记到别人头上了。
#   现在按"脸中心离画面中线多远"来挑，只有落在这条带子里的才认：
#     0.25 = 中间 50% 宽度（推荐，被试坐正前方）
#     0.40 = 中间 80%（人可能坐得比较偏）
#     0.5  = 全画面（等于不限制，回到旧行为）
#   带子里一个人都没有时：画面里只有一张脸仍然用它；有多张脸就不判定这一帧。
center_band=0.25

# ---------------------------------------------------------------------------
# 姿态门控：看不看得见嘴
#
# 张嘴模型的输入原本是整张人脸框。低头看仪表时，框会落到头发、眼镜、衣领上，
# 框内没有嘴，模型却仍输出 0.86~1.00。实测（马国庆_能见度 10:34 段）：
#     整脸框   中位 0.88，≥0.5 占 59%，最长连续 10.4 秒
#     嘴部小块 中位 0.11，≥0.5 占 24%，最长连续 3.0 秒（真哈欠是 3~6 秒）
# 打开后改用**嘴角关键点裁出的嘴部小块**送模型；判不出来就明确报"嘴不可见"，
# 不硬给概率，也不计哈欠。
#
# 关掉（false）= 退回旧行为：整脸输入、不报低头。
gate_enabled=true

# 喂给张嘴模型的图像范围：
#   false（默认）= 整张脸。模型是按整脸训练的，这条才对得上。
#   true         = 关键点裁出的嘴部小块（2026-11-14 那次改动）。
# 2026-11-18 用同一段录像对比过（详见 视觉对比_20261118\对比.md）：
#   嘴部小块：明显大张嘴的帧也只给 0.00~0.15，两段哈欠漏了一段
#   整脸    ：同样的帧给 0.60~1.00，两段都判出；低头/手挡嘴的帧仍然是 0.00
# 也就是说拦误报靠的是上面的门控，不是裁嘴。真要用旧口径再改 true。
mouth_crop=false

# 嘴角关键点置信低于此值 → 判「嘴不可见」。0.5 偏严，远处小脸容易达不到。
kp_conf=0.5

# 嘴角纵坐标超过人脸框高度的这个比例 → 判「低头过度」。
#   0.95 = 嘴已经贴到框底（再低就被裁掉了，推荐）
#   0.90 = 更严格，低头稍多就报
mouth_low_ratio=0.95

# 人脸检测用哪个模型：
#   scrfd = det_500m.onnx（InsightFace 的 SCRFD，纯 ONNX，默认）。
#           同一段 775 帧素材上与 YOLOv8n-face 检出一致（775/775）、框宽一致（209px），
#           耗时 15.7ms vs 16.2ms；不依赖 ultralytics/torch。
#   yolo  = yolov8n-face.onnx（旧口径，想对照时用）。
# SCRFD 模型缺失会自动退回 yolo，不会让采集起不来。
face_detector=scrfd

# 人脸检测后端（仅 face_detector=yolo 时生效）：
#   ort   = onnxruntime（优先 CUDA，拿不到再退 CPU）。人脸与哈欠都走 ONNX，
#           装 onnxruntime-gpu 才有 GPU 加速，普通 onnxruntime 就是 CPU。
#   auto  = 依次尝试 ort → torch → onnx(cv2.dnn)
#   torch = 只用 ultralytics + torch（装 CUDA 版 torch 时也能用 GPU）
#   onnx  = 只用 cv2.dnn（纯 CPU，最省依赖）
backend=ort

# 推理设备：cuda / cpu / auto
#   本机按 cpu 跑：onnxruntime 虽然是 GPU 版，但机器里没装 cuDNN/cuBLAS，
#   CUDA 会话起不来，硬设 cuda 只会每次都退回 CPU 并刷一条警告。
#   换到装了 CUDA 运行时的机器，把这里改成 cuda 即可（代码不用动）。
device=cpu

# device=cuda 但 CUDA 不可用时，是否自动退回 CPU。
# true  = 照常运行，界面和自检里标明「CPU（GPU 不可用：原因）」
# false = 直接报错，避免"以为在跑 GPU 实际在跑 CPU"
gpu_fallback=true

# 人脸检测置信度阈值
face_conf=0.35

[hr]
# 界面实时心率的统计窗口与出值节奏。
# 窗口越长越准（可用 R 峰变多，中位数 RR 更稳），代价是反应慢。
# window_sec=12 / update_sec=1 是原来的行为。
window_sec=30
update_sec=5

# 一次计算至少要有多少个 R 峰，不够就沿用上一次的值（显示"采集中"）
min_beats=10

